<!-- MODE SELECTION -->
<section id="modeScreen" class="screen mode-screen hidden">
  <div class="screen-nav-panel">
    <button id="backToModules" class="btn-ghost">← Kembali ke Modul</button>
    <span class="screen-nav-label">Pilih pengalaman belajar</span>
  </div>

  <div class="mode-heading">
    <div class="mode-course-art" aria-hidden="true"><span>360°</span><b>VR</b></div>
    <div>
      <p class="eyebrow">Modul terpilih</p>
      <h1 id="selectedModuleTitle">-</h1>
      <p id="selectedModuleDescription" class="description">-</p>
    </div>
    <div class="module-meta">
      <span id="selectedModuleSegments">- segmen</span>
      <span id="selectedModuleDecisions">- decision point</span>
    </div>
  </div>

  <div class="mode-grid">
    <div class="path-head">
      <span class="screen-nav-label">Jalur belajar</span>
      <button id="restartModule" class="btn-ghost" type="button">Mulai dari awal</button>
    </div>
    <p id="pathHint" class="description">Ketuk segmen yang terbuka untuk melanjutkan.</p>
    <div id="segmentPath" class="segment-path"></div>
  </div>

  <!-- Popup pilih mode setelah segmen dipilih -->
  <div id="modePopup" class="mobile-quiz-popup mode-popup-center hidden">
    <div class="mobile-quiz-card">
      <span class="mobile-quiz-eyebrow">Putar dengan</span>
      <h3 id="modePopupTitle">-</h3>
      <div class="mobile-quiz-options">
        <button id="popupVrMode" class="mobile-quiz-option" type="button"><span class="opt-label">VR</span><span>Mode VR — headset + remote</span></button>
        <button id="popupMobileMode" class="mobile-quiz-option" type="button"><span class="opt-label">HP</span><span>Mode Mobile — layar sentuh</span></button>
        <button id="popupCancel" class="mobile-quiz-option" type="button"><span class="opt-label">×</span><span>Batal</span></button>
      </div>
    </div>
  </div>
</section>
