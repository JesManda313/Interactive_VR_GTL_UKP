<!-- MODE SELECTION -->
<section id="modeScreen" class="screen mode-screen hidden">
  <div class="screen-nav-panel">
    <button id="backToModules" class="btn-ghost">← Kembali ke Modul</button>
    <span class="screen-nav-label">Pilih pengalaman belajar</span>
  </div>

  <div class="mode-heading">
    <div class="mode-course-art" aria-hidden="true"><span>360°</span><b>VR</b></div>
    <div>
      <p class="eyebrow">Modul terpilih</p>
      <h1 id="selectedModuleTitle">-</h1>
      <p id="selectedModuleDescription" class="description">-</p>
    </div>
    <div class="module-meta">
      <span id="selectedModuleSegments">- segmen</span>
      <span id="selectedModuleDecisions">- decision point</span>
    </div>
  </div>

  <div class="mode-grid">
    <button id="openVrMode" class="mode-card">
      <span class="mode-text">
        <strong>Mode VR</strong>
        <small>Tampilan kiri-kanan untuk headset Shinecon VR. Pilih jawaban dengan remote.</small>
      </span>
      <span class="mode-go">→</span>
    </button>

    <button id="openMobileMode" class="mode-card">
      <span class="mode-text">
        <strong>Mode Mobile</strong>
        <small>Satu layar penuh. Geser view dengan drag dan pilih jawaban dengan tap.</small>
      </span>
      <span class="mode-go">→</span>
    </button>
  </div>
</section>
