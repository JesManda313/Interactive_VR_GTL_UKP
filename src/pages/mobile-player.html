<!-- MOBILE PLAYER: 360 (A-Frame videosphere) atau FLAT fullscreen (Sony A6400) -->
<section id="mobileScreen" class="screen player-screen hidden">
  <!-- Mode 360: scene A-Frame -->
  <div id="mobileSceneMount" class="scene-mount full-scene"></div>

  <!-- Mode FLAT (camera: sony-a6400): video langsung full layar HP, tanpa environment bioskop -->
  <div id="mobileFlatWrap" class="mobile-flat-wrap hidden">
    <div class="mobile-flat-topbar">
      <button id="mobileFlatBack" class="mobile-flat-back" type="button">‹ Kembali</button>
      <div class="mobile-flat-titlebox">
        <strong id="mobileFlatTitle">-</strong>
        <span id="mobileFlatTag">-</span>
      </div>
    </div>

    <video
      id="mobileFlatVideo"
      class="scenario-video mobile-flat-video"
      controls
      playsinline
      webkit-playsinline
      preload="metadata"
      crossorigin="anonymous"
    ></video>

    <!-- Hint saat HP masih portrait: ajak putar ke landscape -->
    <div id="mobileRotateHint" class="mobile-rotate-hint hidden">
      <span>Putar HP ke landscape untuk tampilan penuh</span>
    </div>

    <!-- Branching: popup muncul di depan video -->
    <div id="mobileQuizPopup" class="mobile-quiz-popup hidden">
      <div class="mobile-quiz-card">
        <span class="mobile-quiz-eyebrow">Decision Point</span>
        <h3 id="mobileQuizQuestion">-</h3>
        <div id="mobileQuizOptions" class="mobile-quiz-options"></div>
        <p id="mobileQuizFeedback" class="mobile-quiz-feedback"></p>
      </div>
    </div>

    <div id="mobileEndPopup" class="mobile-quiz-popup hidden">
      <div class="mobile-quiz-card">
        <span class="mobile-quiz-eyebrow">Selesai</span>
        <h3 id="mobileEndTitle">Modul selesai</h3>
        <p class="mobile-quiz-feedback">Semua segmen sudah diputar.</p>
        <button id="mobileEndBack" class="btn-primary" type="button">Kembali ke mode</button>
      </div>
    </div>

    <!-- Overlay terjadwal flat: di dalam wrap agar tetap terlihat saat fullscreen landscape -->
    <div id="mobileTimedOverlay" class="mobile-timed-overlay pos-bawah hidden">
      <button id="mobileTimedClose" class="mobile-timed-close" type="button" aria-label="Tutup">✕</button>
      <div id="mobileTimedImgs" class="mobile-timed-imgs"></div>
      <p id="mobileTimedText" class="mobile-timed-text"></p>
    </div>

    <!-- Fade khusus flat: di dalam wrap agar transisi tetap terlihat saat fullscreen.
         #mobileFadeOverlay di luar tetap ada untuk mode 360 (lihat fade.js). -->
    <div id="mobileFlatFadeOverlay" class="fade-overlay mobile-fade-overlay">
      <div class="fade-message"></div>
    </div>
  </div>

  <!-- Fade untuk mode 360 (di luar wrap karena wrap hidden saat 360) -->
  <div id="mobileFadeOverlay" class="fade-overlay mobile-fade-overlay">
    <div id="mobileFadeText" class="fade-message"></div>
  </div>
</section>
