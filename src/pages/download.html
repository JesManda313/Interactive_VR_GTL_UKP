<!-- DOWNLOAD MODUL (gaya PUBG: unduh paket dulu sebelum main) -->
<section id="downloadScreen" class="screen mode-screen hidden">
  <div class="screen-nav-panel">
    <button id="downloadBack" class="btn-ghost">← Kembali</button>
    <span class="screen-nav-label">Unduhan modul</span>
  </div>

  <div class="mode-heading">
    <div>
      <p class="eyebrow">Persiapan sebelum belajar</p>
      <h1 id="downloadTitle">Mengunduh video modul…</h1>
      <p id="downloadDesc" class="description">Video diunduh sekali saja ke HP, setelah itu bisa diputar offline.</p>
    </div>
    <div class="module-meta">
      <span id="downloadFileInfo">-</span>
    </div>
  </div>

  <div class="dl-panel">
    <div class="dl-bar"><div id="downloadFill" class="dl-fill" style="width: 0%"></div></div>
    <div class="dl-row">
      <strong id="downloadPercent">0%</strong>
      <span id="downloadStatus">Menyiapkan…</span>
    </div>
    <p class="dl-hint">Disarankan memakai WiFi. Jangan tutup aplikasi selama mengunduh. Progress tersimpan otomatis bila terputus.</p>
    <p class="dl-hint">Build: <span id="buildVersion">-</span></p>
    <button id="downloadRetry" class="btn-primary hidden" type="button">Coba lagi</button>
  </div>
</section>
