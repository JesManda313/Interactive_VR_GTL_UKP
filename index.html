<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f5f8fb" />

    <title>GTL VR Learning</title>

    <link rel="stylesheet" href="/src/style.css" />

    <!-- A-Frame dipanggil dari CDN agar tidak dibundel oleh Vite -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>

  <body>
    <!--
      Shell only. Setiap layar di-extend dari partial di src/pages/:
        - home.html          -> #homeScreen, #moduleList
        - settings.html      -> #settingsScreen (kalibrasi VR)
        - mode.html          -> #modeScreen (pilih VR / Mobile)
        - mobile-player.html -> #mobileScreen
        - vr-player.html     -> #vrScreen
      Partial di-inline saat build via `?raw` import di src/main.js,
      lalu disuntik ke #appShell sebelum logika dijalankan.
    -->
    <div id="appShell"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
